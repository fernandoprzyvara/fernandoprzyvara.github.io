<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>D5 Stereo WebXR</title>
<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-stereo-component/dist/aframe-stereo-component.min.js"></script>
<style>body{margin:0}</style></head>
<body>
<a-scene vr-mode-ui="enabled:true">
<a-assets><img id="pano" src="panorama.jpg"></a-assets>
<a-entity geometry="primitive:sphere;radius:5000" material="src:#pano;side:back" stereo="eye:left;mode:top-bottom" scale="-1 1 1"></a-entity>
<a-entity geometry="primitive:sphere;radius:5000" material="src:#pano;side:back" stereo="eye:right;mode:top-bottom" scale="-1 1 1"></a-entity>
<a-camera></a-camera>
</a-scene>
</body></html>
