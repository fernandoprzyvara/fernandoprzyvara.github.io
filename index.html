<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>D5 Render VR</title>

<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#info{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-family:Arial;
    background:rgba(0,0,0,.5);
    padding:10px 18px;
    border-radius:20px;
    z-index:999;
}
</style>

<script>
AFRAME.registerShader('stereo360',{

schema:{
src:{type:'map'}
},

vertexShader:`

varying vec2 vUV;

void main(){

vUV=uv;

gl_Position=projectionMatrix*
modelViewMatrix*
vec4(position,1.0);

}

`,

fragmentShader:`

uniform sampler2D src;

varying vec2 vUV;

void main(){

vec2 uv=vUV;

#ifdef VIEW_ID

if(VIEW_ID==0.0){

uv.y=uv.y*0.5+0.5;

}else{

uv.y=uv.y*0.5;

}

#else

uv.y=uv.y*0.5+0.5;

#endif

gl_FragColor=texture2D(src,uv);

}

`

});
</script>

</head>

<body>

<div id="info">
Clique em <b>Enter VR</b> no Meta Quest
</div>

<a-scene>

<a-assets>
<img id="pano" src="panorama.jpg">
</a-assets>

<a-sky
radius="5000"
shader="stereo360"
material="shader:stereo360;src:#pano"
scale="-1 1 1">
</a-sky>

<a-camera></a-camera>

</a-scene>

</body>
</html>
