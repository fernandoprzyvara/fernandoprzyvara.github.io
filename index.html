<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Panorama Estéreo VR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <!-- Componente de estéreo (c-frame, versão mantida) -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-stereo-component@1.1.1/dist/aframe-stereo-component.min.js"></script>

  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #000; color: #fff; font-family: system-ui, sans-serif; font-size: 18px;
      z-index: 999; transition: opacity .4s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>

  <div id="loading">Carregando panorama...</div>

  <a-scene loading-screen="enabled: false">

    <a-assets>
      <!--
        Coloque o arquivo de imagem panorâmica estéreo (top-bottom: olho esquerdo
        em cima, olho direito embaixo) na mesma pasta deste index.html e ajuste
        o nome abaixo se necessário.
      -->
      <img id="panorama" src="panorama.jpg" crossorigin="anonymous">
    </a-assets>

    <!-- Câmera: fora do modo VR, mostra o olho esquerdo (mono) -->
    <a-camera id="cam" position="0 0 0" wasd-controls-enabled="false" stereocam="eye: left"></a-camera>

    <!-- Esfera do olho esquerdo: metade de CIMA da imagem -->
    <a-entity
      geometry="primitive: sphere; radius: 100; segmentsWidth: 64; segmentsHeight: 64"
      material="shader: flat; src: #panorama; side: back"
      scale="-1 1 1"
      stereo="eye: left; split: vertical">
    </a-entity>

    <!-- Esfera do olho direito: metade de BAIXO da imagem -->
    <a-entity
      geometry="primitive: sphere; radius: 100; segmentsWidth: 64; segmentsHeight: 64"
      material="shader: flat; src: #panorama; side: back"
      scale="-1 1 1"
      stereo="eye: right; split: vertical">
    </a-entity>

  </a-scene>

  <script>
    // Esconde a tela de carregamento assim que a textura terminar de carregar
    const img = document.getElementById('panorama');
    const loading = document.getElementById('loading');
    function hideLoading() { loading.classList.add('hidden'); }
    if (img.complete) {
      hideLoading();
    } else {
      img.addEventListener('load', hideLoading);
      img.addEventListener('error', () => { loading.textContent = 'Erro ao carregar a imagem panorama.jpg'; });
    }
  </script>

</body>
</html>
